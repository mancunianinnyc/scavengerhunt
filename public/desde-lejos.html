<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scavenger Hunt a Distancia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, one card per step, a ticket-stub progress rail on top. */
:root{
  --bg:#f3f0e8; --paper:#fffdf8; --ink:#1d2340; --muted:#5d6380; --line:#d9d4c6;
  --navy:#22306f; --gold:#d9a93b; --terra:#b8532e; --ok:#2f7a4b; --okbg:#e3f1e7; --warn:#9a6a10; --warnbg:#fbf0d6;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12152a; --paper:#1b1f3a; --ink:#ecebf3; --muted:#a6a9c4; --line:#33385c;
  --navy:#8fa0ff; --gold:#e6b94e; --terra:#ea8a63; --ok:#7fd29a; --okbg:#1d3628; --warn:#f0c66b; --warnbg:#3a2f14; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12152a; --paper:#1b1f3a; --ink:#ecebf3; --muted:#a6a9c4; --line:#33385c;
  --navy:#8fa0ff; --gold:#e6b94e; --terra:#ea8a63; --ok:#7fd29a; --okbg:#1d3628; --warn:#f0c66b; --warnbg:#3a2f14; color-scheme:dark }
html,body{min-height:100%}
body{background:var(--bg); color:var(--ink); font:16px/1.5 var(--body); padding-inline:16px; padding-block:20px 48px}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
header{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{font-family:var(--display); font-size:15px; letter-spacing:.01em; color:var(--navy)}
.brand small{display:block; font-family:var(--body); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.lang{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.lang button{border:0; background:transparent; color:var(--muted); font:600 12px var(--body); padding:6px 12px; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy); color:var(--paper)}
.rail{display:grid; grid-template-columns:repeat(14,1fr); gap:4px}
.rail i{height:6px; border-radius:3px; background:var(--line)}
.rail i.q{background:color-mix(in srgb, var(--gold) 35%, var(--line))}
.rail i.done{background:var(--navy)} .rail i.q.done{background:var(--gold)} .rail i.now{background:var(--terra)}
.score{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:22px 20px; display:flex; flex-direction:column; gap:14px}
.eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--terra)}
h1,h2{font-family:var(--display); font-weight:400; margin:0; text-wrap:balance; line-height:1.15}
h1{font-size:32px; color:var(--navy)} h2{font-size:24px}
p{margin:0} .muted{color:var(--muted)}
.poem{font-family:var(--display); font-size:19px; line-height:1.45; white-space:pre-line; border-left:3px solid var(--gold); padding-left:14px}
details summary{cursor:pointer; color:var(--muted); font-size:14px}
details .poem{font-size:16px; margin-top:8px; border-color:var(--line)}
.row{display:flex; gap:8px} .row > input{flex:1; min-width:0}
input[type=text]{font:16px var(--body); color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:12px 14px}
input[type=text]:focus{outline:none; border-color:var(--navy)}
button.btn{font:600 16px var(--body); border:0; border-radius:10px; padding:12px 18px; cursor:pointer; background:var(--navy); color:var(--paper)}
button.btn.terra{background:var(--terra)} button.btn.gold{background:var(--gold); color:#1d2340}
button.btn:disabled{opacity:.5; cursor:default}
button.link{border:0; background:none; padding:0; font:500 14px var(--body); color:var(--navy); text-decoration:underline; text-underline-offset:3px; cursor:pointer; align-self:flex-start}
button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.fb{border-radius:10px; padding:10px 12px; font-size:15px}
.fb.no{background:var(--warnbg); color:var(--warn)} .fb.ok{background:var(--okbg); color:var(--ok)}
.lbl{font-size:12px; font-weight:600; color:var(--muted); margin-bottom:-6px}
.look{background:color-mix(in srgb, var(--navy) 8%, var(--paper)); border-radius:10px; padding:10px 12px; font-size:15px}
.look b{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--navy); margin-bottom:2px}
figure.ph{margin:0; display:flex; flex-direction:column; gap:6px}
figure.ph img{width:100%; max-width:100%; aspect-ratio:4/3; object-fit:cover; object-position:center 25%; border-radius:12px; display:block; background:var(--line)}
figure.ph.tall img{aspect-ratio:auto; max-height:520px; width:auto; align-self:center}
figure.ph figcaption{font-size:13.5px; color:var(--muted); display:flex; flex-direction:column; gap:2px}
figure.ph figcaption span{font-size:11.5px} figure.ph figcaption a{color:var(--muted)}
.hint{background:var(--warnbg); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:15px}
.hint b{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.tries{font-size:13px; color:var(--muted)}
.solved-place{font-family:var(--display); font-size:28px; color:var(--ok)}
a.map{display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px}
a.map:hover{border-color:var(--navy)}
a.map .pin{flex:none; width:40px; height:40px; border-radius:50%; background:var(--terra); color:var(--paper); display:grid; place-items:center}
a.map .pin svg{width:22px; height:22px}
a.map b{display:block; font-family:var(--display); font-weight:400; font-size:17px}
a.map span.go{display:block; font-size:13.5px; color:var(--navy); font-weight:600}
.timer{font:700 56px/1 var(--body); font-variant-numeric:tabular-nums; color:var(--navy); text-align:center}
.timer.low{color:var(--terra)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:13.5px; border-radius:999px; padding:4px 10px; border:1px solid var(--line); background:var(--bg)}
.chip.ok{background:var(--okbg); color:var(--ok); border-color:transparent}
.chip.dup{background:var(--warnbg); color:var(--warn); border-color:transparent}
.chip.cat{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-left:4px; opacity:.8}
.big{font:700 48px/1 var(--body); font-variant-numeric:tabular-nums; color:var(--navy)}
table{width:100%; border-collapse:collapse; font-size:14.5px; font-variant-numeric:tabular-nums}
td{padding:7px 0; border-bottom:1px solid var(--line); vertical-align:top} td:last-child{text-align:right; white-space:nowrap; padding-left:10px}
.confirm{background:var(--warnbg); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px}
pre.sum{white-space:pre-wrap; font:13px/1.5 ui-monospace, Consolas, monospace; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; margin:0; max-height:260px; overflow:auto}
ul.how{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
@media (prefers-reduced-motion:no-preference){ .card{animation:in .25s ease-out} @keyframes in{from{transform:translateY(6px); opacity:.6}} }
</style>

<div class="wrap" id="app"></div>

/* ---------- matching ---------- */
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function lev(a, b){ if (a === b) return 0; const m = a.length, n = b.length; if (!m || !n) return m || n;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n]; }
const thr = len => len >= 12 ? 2 : len >= 5 ? 1 : 0;
const ART = new Set(['el','la','los','las','de','del','the','in','en']);
const strip = (s, extra) => s.split(' ').filter(w => w && !ART.has(w) && !(extra && extra.has(w))).join(' ');

function checkStop(guess, aliases){
  const g = norm(guess), gs = strip(g); if (!gs) return 'empty';
  let close = false;
  for (const a of aliases){ const as = strip(a) || a;
    if (g === a || gs === as) return 'ok';
    if (as.length >= 5 && gs.includes(as)) return 'ok';
    if (gs.length >= 5 && as.includes(gs) && gs.length >= as.length * 0.6) return 'ok';
    const d = lev(gs, as); if (d <= thr(as.length)) return 'ok'; if (d <= thr(as.length) + 2) close = true;
    if (as.split(' ').some(w => w.length >= 5 && gs.split(' ').some(x => lev(x, w) <= 1))) close = true; }
  return close ? 'close' : 'no';
}
const STRIP = {
  loc: new Set(['localidad']),
  uni: new Set(['universidad','u','fundacion','universitaria','corporacion','pontificia','colombia','bogota','sede','uni']),
  water: new Set(['rio','humedal','quebrada','embalse','represa','laguna','lago']),
  culture: new Set([]),
};
function matchItem(r, answer){
  const items = DATA.rounds[r].items, ex = STRIP[r], raw = norm(answer), s = strip(raw, ex);
  if (!s) return null; let best = null, bestScore = 0;
  items.forEach((it, idx) => { for (const a of it.al){ const ra = norm(a), sa = strip(ra, ex) || ra; let sc = 0;
    if (raw === ra) sc = 4; else if (s === sa) sc = 3; else if (lev(s, sa) <= thr(sa.length)) sc = 2;
    else if ((sa.length >= 5 && s.includes(sa)) || (r === 'culture' && s.length >= 6 && sa.includes(s))) sc = 1;
    if (sc > bestScore){ bestScore = sc; best = idx; } } });
  return best;
}

    const nextF = FLOW[S.pos + 1];
    const label = nextF.t === 'quiz' ? L.toQuiz : nextF.t === 'finish' ? L.finishBtn : L.next;
    return `<section class="card">${eyebrow}<h2>${st.gaveUp ? esc(L.revealed) : esc(L.right)}</h2><div class="solved-place">${esc(s.place)}</div>
      <p class="muted">${st.gaveUp ? '0' : stopPts(st)} ${L.pts}${st.hint && !st.gaveUp ? ` · ${L.hintUsed}` : ''}</p>
      <div><div class="eyebrow" style="color:var(--muted)">${esc(L.did)}</div><p>${esc(S.lang === 'en' ? s.did_en : s.did_es)}</p></div>
      ${s.photo ? `<figure class="ph ${s.photo.tall ? 'tall' : ''}"><img src="${s.photo.src}" alt="${esc(S.lang === 'en' ? s.photo.cap_en : s.photo.cap_es)}" loading="lazy"><figcaption>${esc(S.lang === 'en' ? s.photo.cap_en : s.photo.cap_es)}${s.photo.credit ? `<span><a href="${esc(s.photo.page)}" target="_blank" rel="noopener">${esc(L.photoBy)}: ${esc(s.photo.credit)}</a></span>` : ''}</figcaption></figure>` : ''}
      <a class="map" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.maps)}" target="_blank" rel="noopener"><span class="pin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></span><span><b>${esc(s.place)}</b><span class="go">${esc(L.map)} ↗</span></span></a>
      <button class="btn" id="nextBtn">${esc(label)} →</button></section>`;
  }
  const fb = st.last === 'close' ? `<div class="fb no" role="status">${esc(L.close)}</div>` : st.last === 'no' ? `<div class="fb no" role="status">${esc(L.wrong)}</div>` : '';
  const canGiveUp = st.hint && st.triesAfterHint >= 1;
  return `<section class="card">${eyebrow}<div class="lbl">${esc(L.clueL)}</div>${poem(s)}
    <div class="look"><b>${esc(L.lookL)}</b>${esc(S.lang === 'en' ? s.look_en : s.look_es)}</div>
    ${st.hint ? `<div class="hint"><b>${esc(L.hintL)}</b>${esc(S.lang === 'en' ? s.hint_en : s.hint_es)}</div>` : ''}
    <div class="row"><input type="text" id="guess" placeholder="${esc(L.guessPh)}" autocomplete="off" autocapitalize="words" enterkeyhint="go"><button class="btn terra" id="guessBtn">${esc(L.guess)}</button></div>
    ${fb}${st.tries ? `<div class="tries">${esc(L.tries(st.tries))}</div>` : ''}
    ${!st.hint ? `<button class="link" id="hintBtn">${esc(L.hintBtn)}</button>` : ''}
    ${canGiveUp ? `<button class="link" id="giveUpBtn">${esc(L.giveUp)}</button>` : ''}</section>`;
}
function chip(r, e){
  if (e.k === 'ok'){ const it = DATA.rounds[r].items[e.idx];
    return `<span class="chip ok">✓ ${esc(it.name)}${r === 'culture' ? `<span class="chip cat">${esc(t().cat[it.cat])}</span>` : ''}</span>`; }
  if (e.k === 'dup') return `<span class="chip dup">${esc(e.text)} · ${esc(t().dup)}</span>`;
  return `<span class="chip">${esc(e.text)}</span>`;
}
function quizCard(r){
  const L = t(), q = S.quiz[r], left = S.deadline ? Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000)) : null;
  const head = `<div class="eyebrow">${L.quiz} · ${r === 'loc' || r === 'uni' ? 'Ross' : 'J'}</div><h2>${esc(L.rounds[r])}</h2><p class="muted">${esc(L.rules[r])}</p>`;
  if (q.done){
    const ok = q.entries.filter(e => e.k === 'ok'), unk = q.entries.filter(e => e.k === 'no');
    const nextF = FLOW[S.pos + 1];
    return `<section class="card">${head}<div class="big">${roundPts(r)} <span style="font-size:18px" class="muted">${L.pts}</span></div>
      <div><div class="eyebrow" style="color:var(--muted)">${esc(L.counted)} (${ok.length})</div><div class="chips">${ok.map(e => chip(r, e)).join('') || '—'}</div></div>
      ${unk.length ? `<div><div class="eyebrow" style="color:var(--muted)">${esc(L.unknown)}</div><div class="chips">${unk.map(e => chip(r, e)).join('')}</div></div>` : ''}
      <button class="btn" id="nextBtn">${esc(nextF.t === 'quiz' ? L.next : L.next)} →</button></section>`;
  }
  if (!S.deadline) return `<section class="card">${head}<p>${esc(L.ready)}</p><button class="btn gold" id="goBtn">${esc(L.go)}</button></section>`;
  return `<section class="card">${head}<div class="timer ${left <= 10 ? 'low' : ''}" id="timer" aria-live="off">${left}</div>
    <div class="row"><input type="text" id="ans" placeholder="${esc(L.addPh)}" autocomplete="off" enterkeyhint="enter"><button class="btn terra" id="addBtn">${esc(L.add)}</button></div>
    <div class="chips" id="chips">${q.entries.slice().reverse().map(e => chip(r, e)).join('')}</div></section>`;
}
function summaryText(){
  const L = t(), lines = [`🗺️ El Gran Scavenger Hunt · ${L.tag}`, `${S.lang === 'en' ? 'Team' : 'Equipo'}: ${S.team}`, ''];
  STOPS.forEach((s, i) => { const st = S.stops[i]; lines.push(`${s.n}. ${s.place}: ${stopPts(st)}${st.gaveUp ? ` (${L.gaveUp})` : st.hint ? ` (${L.hintUsed})` : ''}`); });
  lines.push('');
  ['loc','uni','water','culture'].forEach(r => { const q = S.quiz[r];
    const ok = q.entries.filter(e => e.k === 'ok').map(e => DATA.rounds[r].items[e.idx].name), unk = q.entries.filter(e => e.k === 'no').map(e => e.text);
    lines.push(`${L.rounds[r]}: ${roundPts(r)} ${L.pts}${ok.length ? `\n  ✓ ${ok.join(', ')}` : ''}${unk.length ? `\n  ? ${unk.join(', ')}` : ''}`); });
  lines.push('', `${L.stopsL}: ${stopsTotal()} · ${L.quizL}: ${quizTotal()} · ${L.total}: ${stopsTotal() + quizTotal()}`);
  return lines.join('\n');
}
function finishCard(){
  const L = t();
  const rows = STOPS.map((s, i) => { const st = S.stops[i]; return `<tr><td>${s.n}. ${esc(s.place)}${st.gaveUp ? ` <span class="muted">· ${esc(L.gaveUp)}</span>` : st.hint ? ` <span class="muted">· ${esc(L.hintUsed)}</span>` : ''}</td><td>${stopPts(st)}</td></tr>`; }).join('')
    + ['loc','uni','water','culture'].map(r => `<tr><td>${esc(L.rounds[r])}</td><td>${roundPts(r)}</td></tr>`).join('');
  return `<section class="card"><div class="eyebrow">${esc(S.team)}</div><h1>${esc(L.finH)}</h1>
    <div class="big">${stopsTotal() + quizTotal()} <span style="font-size:18px" class="muted">${L.pts}</span></div>
    <p class="muted">${L.stopsL} ${stopsTotal()} / 100 · ${L.quizL} ${quizTotal()}</p>
    <table>${rows}</table>
    <p>${esc(L.finP)}</p><pre class="sum" id="sum">${esc(summaryText())}</pre>
    <button class="btn terra" id="copyBtn">${esc(L.copy)}</button><div id="copyMsg" class="muted" role="status"></div>
    ${S.confirm ? `<div class="confirm"><p>${esc(L.sure)}</p><div class="row"><button class="btn terra" id="yesBtn">${esc(L.yes)}</button><button class="btn" id="noBtn">${esc(L.no)}</button></div></div>` : `<button class="link" id="restartBtn">${esc(L.restart)}</button>`}</section>`;
}
function render(){
  let body;
  if (!S.started) body = intro();
  else { const f = FLOW[S.pos]; body = f.t === 'stop' ? stopCard(f.i) : f.t === 'quiz' ? quizCard(f.r) : finishCard(); }
  app.innerHTML = header() + body;
  bind();
}

/* ---------- actions ---------- */
let tick = null;
function startTimer(){ clearInterval(tick); tick = setInterval(() => {
  const f = FLOW[S.pos]; if (f.t !== 'quiz' || !S.deadline){ clearInterval(tick); return; }
  const left = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000)); const el = document.getElementById('timer');
  if (el){ el.textContent = left; el.classList.toggle('low', left <= 10); }
  if (left <= 0){ clearInterval(tick); S.quiz[f.r].done = true; S.deadline = null; save(); render(); } }, 200); }
function bind(){
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { S.lang = b.dataset.lang; save(); render(); });
  const $ = id => document.getElementById(id);
  if ($('startBtn')){ const go = () => { const v = $('team').value.trim(); if (!v){ $('team').focus(); return; } S.team = v; S.started = true; save(); render(); };
    $('startBtn').onclick = go; $('team').onkeydown = e => { if (e.key === 'Enter') go(); }; }
  const f = FLOW[S.pos];
  if (S.started && f.t === 'stop'){ const st = S.stops[f.i];
    const doGuess = () => { const v = $('guess').value; const res = checkStop(v, STOPS[f.i].aliases); if (res === 'empty') return;
      st.tries++; if (st.hint) st.triesAfterHint++;
      if (res === 'ok'){ st.solved = true; st.last = 'ok'; } else st.last = res;
      save(); render(); const g = $('guess'); if (g) g.focus(); };
    if ($('guessBtn')){ $('guessBtn').onclick = doGuess; $('guess').onkeydown = e => { if (e.key === 'Enter') doGuess(); }; }
    if ($('hintBtn')) $('hintBtn').onclick = () => { st.hint = true; st.last = null; save(); render(); };
    if ($('giveUpBtn')) $('giveUpBtn').onclick = () => { st.solved = true; st.gaveUp = true; save(); render(); };
  }
  if (S.started && f.t === 'quiz'){
    if ($('goBtn')) $('goBtn').onclick = () => { S.deadline = Date.now() + ROUND_SECONDS * 1000; save(); render(); const a = $('ans'); if (a) a.focus(); };
    if (S.deadline) startTimer();
    const add = () => { const inp = $('ans'); const v = inp.value.trim(); if (!v || !S.deadline) return; inp.value = '';
      const q = S.quiz[f.r], idx = matchItem(f.r, v);
      if (idx == null) q.entries.push({text:v, k:'no'});
      else if (q.entries.some(e => e.k === 'ok' && e.idx === idx)) q.entries.push({text:v, k:'dup'});
      else q.entries.push({text:v, k:'ok', idx});
      save(); $('chips').innerHTML = q.entries.slice().reverse().map(e => chip(f.r, e)).join(''); inp.focus(); };
    if ($('addBtn')){ $('addBtn').onclick = add; $('ans').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); add(); } }; }
  }
  if ($('nextBtn')) $('nextBtn').onclick = () => { S.pos = Math.min(S.pos + 1, FLOW.length - 1); save(); render(); window.scrollTo(0, 0); const g = $('guess'); if (g) g.focus(); };
  if ($('copyBtn')) $('copyBtn').onclick = () => { const txt = summaryText();
    try { navigator.clipboard.writeText(txt).then(() => { $('copyMsg').textContent = t().copied; }, () => fail()); } catch(_) { fail(); }
    function fail(){ $('copyMsg').textContent = t().copyFail; const r = document.createRange(); r.selectNodeContents($('sum')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
  if ($('restartBtn')) $('restartBtn').onclick = () => { S.confirm = true; render(); };
  if ($('noBtn')) $('noBtn').onclick = () => { S.confirm = false; render(); };
  if ($('yesBtn')) $('yesBtn').onclick = () => { const lang = S.lang; S = fresh(); S.lang = lang; save(); render(); };
}
render();
</script>
